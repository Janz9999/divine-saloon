# Builds the Android release APK on every push to main (and on demand).
# Download it from the run's page on GitHub → "Artifacts" → app-release-apk.
#
# NOTE: release builds are still signed with Flutter's debug key
# (android/app/build.gradle.kts). Fine for installing on test phones,
# but Google Play needs a real upload key — see the TODO there.

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button on the Actions tab

# A newer push cancels a build that's still running for the same branch.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5 # same as local development
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
